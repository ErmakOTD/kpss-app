<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>КПСС группа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #0b141a;
            color: #e9edef;
            overflow-x: hidden;
        }
        
        /* Загрузка */
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 18px;
            color: #00a884;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin-top: 20px;
            border: 3px solid #00a884;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Главный контейнер */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            position: relative;
        }
        
        /* Боковое меню */
        .sidebar {
            width: 280px;
            background-color: #111b21;
            border-right: 1px solid #2a3942;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
        }
        
        .sidebar.closed {
            transform: translateX(-100%);
        }
        
        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid #2a3942;
            background-color: #1f2c33;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .sidebar-header h2 {
            font-size: 20px;
            color: #00a884;
        }
        
        .sidebar-header span {
            color: #8696a0;
            font-size: 14px;
        }
        
        .sidebar-menu {
            padding: 8px 0;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            color: #e9edef;
            cursor: pointer;
            transition: background-color 0.2s;
            border-left: 3px solid transparent;
        }
        
        .menu-item:hover {
            background-color: #1f2c33;
        }
        
        .menu-item.active {
            background-color: #1f2c33;
            border-left-color: #00a884;
        }
        
        .menu-item .icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }
        
        .menu-item .title {
            flex: 1;
            font-size: 15px;
        }
        
        .menu-item .badge {
            background-color: #00a884;
            color: #111b21;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* Основной контент */
        .main-content {
            flex: 1;
            margin-left: 280px;
            width: calc(100% - 280px);
            transition: margin-left 0.3s ease;
            height: 100vh;
            overflow-y: auto;
            background-color: #0b141a;
        }
        
        .main-content.expanded {
            margin-left: 0;
            width: 100%;
        }
        
        /* Шапка */
        .content-header {
            background-color: #202c33;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #2a3942;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .menu-toggle {
            font-size: 24px;
            cursor: pointer;
            color: #aebac1;
            background: none;
            border: none;
            padding: 4px 8px;
        }
        
        .content-header h1 {
            font-size: 20px;
            font-weight: 500;
            flex: 1;
        }
        
        .content-header span {
            font-size: 14px;
            color: #8696a0;
        }
        
        .header-actions {
            display: flex;
            gap: 16px;
            color: #aebac1;
        }
        
        .header-actions span {
            cursor: pointer;
            font-size: 20px;
        }
        
        /* Вкладки */
        .tabs-container {
            background-color: #111b21;
            border-bottom: 1px solid #2a3942;
            position: sticky;
            top: 60px;
            z-index: 90;
        }
        
        .tabs {
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0 8px;
        }
        
        .tabs::-webkit-scrollbar {
            display: none;
        }
        
        .tab {
            padding: 12px 16px;
            color: #8696a0;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab.active {
            color: #00a884;
            border-bottom-color: #00a884;
        }
        
        /* Контент вкладок */
        .tab-content {
            display: none;
            padding: 8px 0;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Секции */
        .section {
            background-color: #111b21;
            margin: 8px 0;
        }
        
        .section-header {
            padding: 12px 16px;
            color: #00a884;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #2a3942;
            cursor: pointer;
        }
        
        .section-header span:last-child {
            margin-left: auto;
        }
        
        .section-content {
            transition: all 0.3s;
        }
        
        .section-content.collapsed {
            display: none;
        }
        
        /* Чат-элементы */
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background-color: #111b21;
            border-bottom: 1px solid #2a3942;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .chat-item:hover {
            background-color: #1f2c33;
        }
        
        .chat-item .avatar {
            width: 49px;
            height: 49px;
            border-radius: 50%;
            background-color: #2a3942;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d1d7db;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-item .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .chat-item .title {
            font-size: 17px;
            color: #e9edef;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item .time {
            font-size: 12px;
            color: #8696a0;
        }
        
        .chat-item .message {
            color: #8696a0;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item .sender {
            color: #d1d7db;
        }
        
        .chat-item .hide-btn {
            color: #ff6b6b;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: rgba(255,107,107,0.1);
            margin-left: 8px;
            cursor: pointer;
        }
        
        .chat-item.hidden {
            display: none;
        }
        
        /* Важная информация */
        .important-card {
            background-color: #182229;
            margin: 8px 16px;
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid #00a884;
            cursor: pointer;
        }
        
        .important-card .sender {
            color: #00a884;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .important-card .text {
            color: #e9edef;
            font-size: 15px;
            margin-bottom: 4px;
        }
        
        .important-card .time {
            color: #8696a0;
            font-size: 11px;
            text-align: right;
        }
        
        /* Расписание */
        .schedule-grid {
            padding: 8px 16px;
        }
        
        .schedule-day {
            margin-bottom: 16px;
        }
        
        .schedule-day h3 {
            color: #53bdeb;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .schedule-lesson {
            display: flex;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #2a3942;
            cursor: pointer;
        }
        
        .schedule-lesson:last-child {
            border-bottom: none;
        }
        
        .lesson-time {
            min-width: 70px;
            color: #53bdeb;
        }
        
        .lesson-details {
            flex: 1;
        }
        
        .lesson-name {
            color: #e9edef;
            font-weight: 500;
        }
        
        .lesson-place {
            color: #8696a0;
            font-size: 13px;
        }
        
        /* Хэштеги */
        .hashtags-container {
            padding: 12px 16px;
        }
        
        .hashtag-category {
            margin-bottom: 20px;
        }
        
        .category-title {
            color: #8696a0;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .hashtag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .hashtag {
            background-color: #1f2c33;
            color: #d1d7db;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .hashtag:hover {
            background-color: #2a3942;
        }
        
        /* Галерея */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            padding: 8px 16px;
        }
        
        .gallery-item {
            background-color: #1f2c33;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .gallery-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        
        .gallery-item .caption {
            padding: 8px;
            font-size: 12px;
            color: #8696a0;
            text-align: center;
        }
        
        /* Поиск */
        .search-box {
            padding: 8px 16px;
            background-color: #111b21;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px;
            background-color: #1f2c33;
            border: 1px solid #2a3942;
            border-radius: 8px;
            color: #e9edef;
            font-size: 14px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #00a884;
        }
        
        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background-color: #1f2c33;
            border-radius: 16px;
            padding: 20px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            width: 400px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #8696a0;
        }
        
        /* Индикатор обновления */
        .update-indicator {
            background-color: #00a884;
            color: #111b21;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
            z-index: 2000;
        }
        
        .update-indicator.show {
            display: block;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
            }
            
            .main-content {
                margin-left: 0;
                width: 100%;
            }
        }
        
        /* Ошибка */
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #ff6b6b;
        }
        
        .retry-btn {
            background-color: #00a884;
            color: #111b21;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div>Загрузка данных...</div>
        <div class="spinner"></div>
    </div>
    
    <div class="error" id="error" style="display: none;">
        <div>❌ Ошибка загрузки данных</div>
        <div style="font-size: 14px; margin-top: 10px;" id="errorMessage"></div>
        <button class="retry-btn" onclick="location.reload()">Повторить</button>
    </div>
    
    <div class="app-container" id="app" style="display: none;">
        <!-- Боковое меню -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>КПСС</h2>
                <span id="membersCount">17 участников</span>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" onclick="switchMainTab('home'); closeSidebarOnMobile()">
                    <span class="icon">🏠</span>
                    <span class="title">Главная</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('chats'); closeSidebarOnMobile()">
                    <span class="icon">💬</span>
                    <span class="title">Чаты</span>
                    <span class="badge" id="chatsBadge">0</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('schedule'); closeSidebarOnMobile()">
                    <span class="icon">📅</span>
                    <span class="title">Расписание</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('hashtags'); closeSidebarOnMobile()">
                    <span class="icon">✨</span>
                    <span class="title">Хэштеги</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('gallery'); closeSidebarOnMobile()">
                    <span class="icon">🖼️</span>
                    <span class="title">Галерея</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('important'); closeSidebarOnMobile()">
                    <span class="icon">📌</span>
                    <span class="title">Важное</span>
                </div>
            </div>
        </div>
        
        <!-- Основной контент -->
        <div class="main-content" id="mainContent">
            <!-- Шапка -->
            <div class="content-header">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1 id="mainTitle">КПСС</h1>
                <span id="headerMembers">17 участников</span>
                <div class="header-actions">
                    <span onclick="toggleSearch()">🔍</span>
                    <span onclick="showMenu()">⋮</span>
                </div>
            </div>
            
            <!-- Вкладки -->
            <div class="tabs-container">
                <div class="tabs" id="tabs">
                    <div class="tab active" onclick="switchTab('all', this)">Все</div>
                    <div class="tab" onclick="switchTab('chats', this)">Чаты</div>
                    <div class="tab" onclick="switchTab('important', this)">Важное</div>
                    <div class="tab" onclick="switchTab('schedule', this)">Расписание</div>
                    <div class="tab" onclick="switchTab('gallery', this)">Галерея</div>
                    <div class="tab" onclick="switchTab('hashtags', this)">Хэштеги</div>
                </div>
            </div>
            
            <!-- Поиск -->
            <div class="search-box" id="searchBox" style="display: none;">
                <input type="text" placeholder="Поиск по чатам..." id="searchInput" onkeyup="searchChats()">
            </div>
            
            <!-- Контент -->
            <div id="tabContent">
                <!-- Вкладка Все (заполняется динамически) -->
                <div class="tab-content active" id="tab-all"></div>
                
                <!-- Вкладка Чаты -->
                <div class="tab-content" id="tab-chats"></div>
                
                <!-- Вкладка Важное -->
                <div class="tab-content" id="tab-important"></div>
                
                <!-- Вкладка Расписание -->
                <div class="tab-content" id="tab-schedule"></div>
                
                <!-- Вкладка Галерея -->
                <div class="tab-content" id="tab-gallery"></div>
                
                <!-- Вкладка Хэштеги -->
                <div class="tab-content" id="tab-hashtags"></div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно для чата -->
    <div class="modal" id="chatModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalChatTitle">Чат</h2>
                <span class="modal-close" onclick="closeModal('chatModal')">✕</span>
            </div>
            <div id="modalChatContent"></div>
        </div>
    </div>
    
    <!-- Модальное окно для информации -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="infoModalTitle">Информация</h2>
                <span class="modal-close" onclick="closeModal('infoModal')">✕</span>
            </div>
            <div id="infoModalContent"></div>
        </div>
    </div>
    
    <!-- Индикатор обновления -->
    <div class="update-indicator" id="updateIndicator">Данные обновлены</div>

    <script>
        // ========== ID ТАБЛИЦЫ ==========
        // ID из твоей ссылки
        const SPREADSHEET_ID = '2PACX-1vSsSqamntRqegFjdSxWXgutpyHpZx69KijaC7QgKGCHV7zPtkE3lUZ3mSV17lCZsYMep1so1gjCOk7G';
        
        // Базовый URL для получения данных в формате JSON
        const BASE_URL = `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?output=csv`;
        
        // Данные приложения
        let appData = {
            important: [],
            chats: [],
            schedule: [],
            hashtags: [],
            gallery: []
        };
        
        // Скрытые чаты
        let hiddenChats = [];
        
        // ========== ЗАГРУЗКА ДАННЫХ ==========
        async function loadAllData() {
            showLoading(true);
            
            try {
                // Загружаем все листы
                const important = await fetchSheet('important');
                const chats = await fetchSheet('chats');
                const schedule = await fetchSheet('schedule');
                const hashtags = await fetchSheet('hashtags');
                const gallery = await fetchSheet('gallery');
                
                // Парсим данные
                appData.important = parseCSV(important);
                appData.chats = parseCSV(chats);
                appData.schedule = parseCSV(schedule);
                appData.hashtags = parseCSV(hashtags);
                appData.gallery = parseCSV(gallery);
                
                console.log('✅ Данные загружены:', appData);
                
                // Обновляем интерфейс
                renderAll();
                updateCounters();
                showLoading(false);
                showUpdateIndicator();
                
            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                showLoading(false);
                showError('Ошибка загрузки данных: ' + error.message);
            }
        }
        
        // Загрузка конкретного листа
        async function fetchSheet(sheetName) {
            const url = `${BASE_URL}&sheet=${sheetName}`;
            console.log('Загрузка:', url);
            
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP ошибка ${response.status}`);
            }
            return await response.text();
        }
        
        // Парсинг CSV в массив объектов
        function parseCSV(csv) {
            if (!csv) return [];
            
            const lines = csv.split('\n');
            if (lines.length < 2) return [];
            
            // Заголовки - первая строка
            const headers = lines[0].split(',').map(h => h.trim());
            
            const result = [];
            
            // Данные - остальные строки
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // Разбираем CSV с учётом кавычек
                const values = [];
                let inQuotes = false;
                let currentValue = '';
                
                for (let char of line) {
                    if (char === '"' && !inQuotes) {
                        inQuotes = true;
                    } else if (char === '"' && inQuotes) {
                        inQuotes = false;
                    } else if (char === ',' && !inQuotes) {
                        values.push(currentValue);
                        currentValue = '';
                    } else {
                        currentValue += char;
                    }
                }
                values.push(currentValue);
                
                // Создаем объект
                const obj = {};
                headers.forEach((header, index) => {
                    let value = values[index] || '';
                    // Убираем лишние кавычки и пробелы
                    value = value.replace(/^"|"$/g, '').trim();
                    obj[header] = value;
                });
                
                // Проверяем, что объект не пустой
                if (Object.values(obj).some(v => v)) {
                    result.push(obj);
                }
            }
            
            return result;
        }
        
        // ========== ОТОБРАЖЕНИЕ ДАННЫХ ==========
        function renderAll() {
            renderMainPage();
            renderChatsPage();
            renderImportantPage();
            renderSchedulePage();
            renderHashtagsPage();
            renderGalleryPage();
        }
        
        function renderMainPage() {
            const container = document.getElementById('tab-all');
            if (!container) return;
            
            let html = '';
            
            // Важная информация
            if (appData.important && appData.important.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-header" onclick="toggleSection(this)">
                            <span>📌</span> Важная информация
                            <span>▼</span>
                        </div>
                        <div class="section-content">
                `;
                
                appData.important.forEach(item => {
                    html += `
                        <div class="important-card" onclick="showImportantDetails('${item.id}')">
                            <div class="sender">${item.sender || 'Вы'}</div>
                            <div class="text">${item.text || ''}</div>
                            <div class="time">${item.time || ''} • ${item.date || ''}</div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            // Расписание на сегодня
            if (appData.schedule && appData.schedule.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-header" onclick="toggleSection(this)">
                            <span>📅</span> Расписание на сегодня
                            <span>▼</span>
                        </div>
                        <div class="section-content">
                            <div class="schedule-grid">
                `;
                
                const today = new Date().toLocaleDateString('ru-RU', { weekday: 'long' });
                const todayLessons = appData.schedule.filter(l => 
                    l.day && l.day.toLowerCase().includes(today.toLowerCase())
                );
                
                const lessonsToShow = todayLessons.length > 0 ? todayLessons : appData.schedule.slice(0, 3);
                
                lessonsToShow.forEach(lesson => {
                    html += `
                        <div class="schedule-lesson" onclick="showLessonDetails('${lesson.id}')">
                            <div class="lesson-time">${lesson.time ? lesson.time.split('-')[0] : ''}</div>
                            <div class="lesson-details">
                                <div class="lesson-name">${lesson.subject || ''}</div>
                                <div class="lesson-place">${lesson.room || ''} ауд.</div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div></div></div>`;
            }
            
            // Чаты
            if (appData.chats && appData.chats.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-header" onclick="toggleSection(this)">
                            <span>💬</span> Чаты
                            <span>▼</span>
                        </div>
                        <div class="section-content" id="chatsContainer">
                `;
                
                appData.chats.forEach(chat => {
                    const isHidden = hiddenChats.includes(`chat-${chat.id}`);
                    html += `
                        <div class="chat-item ${isHidden ? 'hidden' : ''}" id="chat-${chat.id}" onclick="openChat('${chat.id}')">
                            <div class="avatar">${chat.avatar || '💬'}</div>
                            <div class="info">
                                <div class="title-row">
                                    <span class="title">${chat.name || 'Чат'}</span>
                                    <span class="time">${chat.time || ''}</span>
                                </div>
                                <div class="message">
                                    <span class="sender">${chat.last_sender || ''}:</span> ${chat.last_message || ''}
                                </div>
                            </div>
                            <span class="hide-btn" onclick="hideChat('chat-${chat.id}', event)">✕</span>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            container.innerHTML = html || '<div class="section" style="padding: 20px; text-align: center;">Нет данных</div>';
        }
        
        function renderChatsPage() {
            const container = document.getElementById('tab-chats');
            if (!container) return;
            
            let html = `
                <div class="section">
                    <div class="section-header">💬 Все чаты</div>
                    <div class="section-content" id="chatsContainer2">
            `;
            
            if (appData.chats && appData.chats.length > 0) {
                appData.chats.forEach(chat => {
                    const isHidden = hiddenChats.includes(`chat-${chat.id}`);
                    html += `
                        <div class="chat-item ${isHidden ? 'hidden' : ''}" id="chat2-${chat.id}" onclick="openChat('${chat.id}')">
                            <div class="avatar">${chat.avatar || '💬'}</div>
                            <div class="info">
                                <div class="title-row">
                                    <span class="title">${chat.name || 'Чат'}</span>
                                    <span class="time">${chat.time || ''}</span>
                                </div>
                                <div class="message">
                                    <span class="sender">${chat.last_sender || ''}:</span> ${chat.last_message || ''}
                                </div>
                            </div>
                            <span class="hide-btn" onclick="hideChat('chat-${chat.id}', event)">✕</span>
                        </div>
                    `;
                });
            } else {
                html += '<div style="padding: 20px; text-align: center;">Нет чатов</div>';
            }
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        function renderImportantPage() {
            const container = document.getElementById('tab-important');
            if (!container) return;
            
            let html = `
                <div class="section">
                    <div class="section-header">📌 Вся важная информация</div>
                    <div class="section-content">
            `;
            
            if (appData.important && appData.important.length > 0) {
                appData.important.forEach(item => {
                    html += `
                        <div class="important-card" onclick="showImportantDetails('${item.id}')">
                            <div class="sender">${item.sender || 'Вы'}</div>
                            <div class="text">${item.text || ''}</div>
                            <div class="time">${item.time || ''} • ${item.date || ''}</div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="padding: 20px; text-align: center;">Нет важной информации</div>';
            }
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        function renderSchedulePage() {
            const container = document.getElementById('tab-schedule');
            if (!container) return;
            
            // Группируем по дням
            const byDay = {};
            if (appData.schedule) {
                appData.schedule.forEach(lesson => {
                    if (!byDay[lesson.day]) byDay[lesson.day] = [];
                    byDay[lesson.day].push(lesson);
                });
            }
            
            let html = `
                <div class="section">
                    <div class="section-header">📅 Полное расписание</div>
                    <div class="section-content">
                        <div class="schedule-grid">
            `;
            
            if (Object.keys(byDay).length > 0) {
                Object.keys(byDay).forEach(day => {
                    html += `<div class="schedule-day"><h3>${day}</h3>`;
                    byDay[day].forEach(lesson => {
                        html += `
                            <div class="schedule-lesson" onclick="showLessonDetails('${lesson.id}')">
                                <div class="lesson-time">${lesson.time || ''}</div>
                                <div class="lesson-details">
                                    <div class="lesson-name">${lesson.subject || ''}</div>
                                    <div class="lesson-place">${lesson.room || ''} ауд. • ${lesson.teacher || ''}</div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                });
            } else {
                html += '<div style="padding: 20px; text-align: center;">Нет расписания</div>';
            }
            
            html += `</div></div></div>`;
            container.innerHTML = html;
        }
        
        function renderHashtagsPage() {
            const container = document.getElementById('tab-hashtags');
            if (!container) return;
            
            // Группируем по категориям
            const byCategory = {};
            if (appData.hashtags) {
                appData.hashtags.forEach(tag => {
                    if (!byCategory[tag.category]) byCategory[tag.category] = [];
                    byCategory[tag.category].push(tag.tag);
                });
            }
            
            let html = `
                <div class="section">
                    <div class="section-header">✨ Все хэштеги</div>
                    <div class="hashtags-container">
            `;
            
            if (Object.keys(byCategory).length > 0) {
                Object.keys(byCategory).forEach(category => {
                    html += `
                        <div class="hashtag-category">
                            <div class="category-title">${category}</div>
                            <div class="hashtag-cloud">
                    `;
                    
                    byCategory[category].forEach(tag => {
                        html += `<span class="hashtag" onclick="searchByHashtag('${tag}')">${tag}</span>`;
                    });
                    
                    html += `</div></div>`;
                });
            } else {
                html += '<div style="padding: 20px; text-align: center;">Нет хэштегов</div>';
            }
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        function renderGalleryPage() {
            const container = document.getElementById('tab-gallery');
            if (!container) return;
            
            let html = `
                <div class="section">
                    <div class="section-header">🖼️ Галерея</div>
                    <div class="gallery-grid">
            `;
            
            if (appData.gallery && appData.gallery.length > 0) {
                appData.gallery.forEach(item => {
                    const imgUrl = item.image_url && item.image_url !== 'https://example.com/image1.jpg' 
                        ? item.image_url 
                        : 'https://via.placeholder.com/300x200/2a3942/00a884?text=Нет+изображения';
                    
                    html += `
                        <div class="gallery-item" onclick="window.open('${imgUrl}', '_blank')">
                            <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/300x200/2a3942/00a884?text=Ошибка'">
                            <div class="caption">${item.title || ''}<br><small>${item.date || ''}</small></div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="padding: 20px; text-align: center;">Нет изображений</div>';
            }
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        // ========== ВЗАИМОДЕЙСТВИЕ ==========
        
        function toggleSection(header) {
            const content = header.nextElementSibling;
            const arrow = header.querySelector('span:last-child');
            
            if (content.style.display === 'none') {
                content.style.display = 'block';
                arrow.textContent = '▼';
            } else {
                content.style.display = 'none';
                arrow.textContent = '▶';
            }
        }
        
        function openChat(chatId) {
            const chat = appData.chats.find(c => c.id == chatId);
            if (!chat) return;
            
            const modal = document.getElementById('chatModal');
            const title = document.getElementById('modalChatTitle');
            const content = document.getElementById('modalChatContent');
            
            title.textContent = chat.name || 'Чат';
            content.innerHTML = `
                <div style="margin-bottom: 10px; color: #8696a0;">Последнее сообщение:</div>
                <div style="margin-bottom: 10px;">
                    <strong>${chat.last_sender || ''}:</strong> ${chat.last_message || ''}<br>
                    <span style="color: #8696a0;">${chat.time || ''}</span>
                </div>
            `;
            
            modal.classList.add('active');
        }
        
        function hideChat(chatId, event) {
            event.stopPropagation();
            
            const chat = document.getElementById(chatId);
            if (chat) {
                chat.classList.add('hidden');
                
                if (!hiddenChats.includes(chatId)) {
                    hiddenChats.push(chatId);
                    localStorage.setItem('hiddenChats', JSON.stringify(hiddenChats));
                }
            }
            
            updateCounters();
        }
        
        function updateCounters() {
            if (!appData.chats) return;
            
            const visibleChats = appData.chats.length - hiddenChats.length;
            const badge = document.getElementById('chatsBadge');
            if (badge) {
                badge.textContent = visibleChats;
                badge.style.display = visibleChats > 0 ? 'inline' : 'none';
            }
        }
        
        function showImportantDetails(id) {
            const item = appData.important.find(i => i.id == id);
            if (!item) return;
            
            const modal = document.getElementById('infoModal');
            const title = document.getElementById('infoModalTitle');
            const content = document.getElementById('infoModalContent');
            
            title.textContent = 'Важная информация';
            content.innerHTML = `
                <div style="margin-bottom: 10px;"><strong>${item.sender || 'Вы'}</strong></div>
                <div style="margin-bottom: 10px; font-size: 18px;">${item.text || ''}</div>
                <div style="color: #8696a0;">${item.time || ''} • ${item.date || ''}</div>
            `;
            
            modal.classList.add('active');
        }
        
        function showLessonDetails(id) {
            const lesson = appData.schedule.find(l => l.id == id);
            if (!lesson) return;
            
            const modal = document.getElementById('infoModal');
            const title = document.getElementById('infoModalTitle');
            const content = document.getElementById('infoModalContent');
            
            title.textContent = lesson.subject || 'Занятие';
            content.innerHTML = `
                <div style="margin-bottom: 10px;">Время: ${lesson.time || ''}</div>
                <div style="margin-bottom: 10px;">Аудитория: ${lesson.room || ''}</div>
                <div style="margin-bottom: 10px;">Преподаватель: ${lesson.teacher || ''}</div>
                <div style="color: #8696a0;">${lesson.day || ''}</div>
            `;
            
            modal.classList.add('active');
        }
        
        function searchByHashtag(tag) {
            alert(`Поиск по хэштегу: ${tag}`);
        }
        
        function toggleSearch() {
            const searchBox = document.getElementById('searchBox');
            if (searchBox.style.display === 'none') {
                searchBox.style.display = 'block';
                document.getElementById('searchInput').focus();
            } else {
                searchBox.style.display = 'none';
            }
        }
        
        function searchChats() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const chats = document.querySelectorAll('.chat-item');
            
            chats.forEach(chat => {
                const title = chat.querySelector('.title')?.textContent.toLowerCase() || '';
                if (title.includes(searchText)) {
                    chat.style.display = 'flex';
                } else {
                    chat.style.display = 'none';
                }
            });
        }
        
        function showMenu() {
            const modal = document.getElementById('infoModal');
            const title = document.getElementById('infoModalTitle');
            const content = document.getElementById('infoModalContent');
            
            title.textContent = 'Меню';
            content.innerHTML = `
                <div style="padding: 10px; cursor: pointer; margin-bottom: 5px;" onclick="showAllChats()">Показать все чаты</div>
                <div style="padding: 10px; cursor: pointer; margin-bottom: 5px;" onclick="refreshData()">Обновить данные</div>
                <div style="padding: 10px; cursor: pointer;" onclick="location.reload()">Перезагрузить</div>
            `;
            
            modal.classList.add('active');
        }
        
        function showAllChats() {
            hiddenChats = [];
            localStorage.removeItem('hiddenChats');
            
            document.querySelectorAll('.chat-item').forEach(chat => {
                chat.classList.remove('hidden');
            });
            
            updateCounters();
            closeModal('infoModal');
        }
        
        function refreshData() {
            closeModal('infoModal');
            loadAllData();
        }
        
        // ========== UI УПРАВЛЕНИЕ ==========
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            sidebar.classList.toggle('closed');
            mainContent.classList.toggle('expanded');
        }
        
        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('closed');
                document.getElementById('mainContent').classList.add('expanded');
            }
        }
        
        function switchMainTab(tabName) {
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            const titles = {
                'home': 'КПСС',
                'chats': 'Чаты',
                'schedule': 'Расписание',
                'hashtags': 'Хэштеги',
                'gallery': 'Галерея',
                'important': 'Важное'
            };
            document.getElementById('mainTitle').textContent = titles[tabName];
            
            if (tabName === 'home') {
                switchTab('all', document.querySelector('.tab'));
            } else {
                switchTab(tabName, null);
            }
        }
        
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            if (element) {
                element.classList.add('active');
            } else {
                document.querySelectorAll('.tab').forEach(tab => {
                    if (tab.textContent.toLowerCase().includes(tabName)) {
                        tab.classList.add('active');
                    }
                });
            }
            
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            const validTabs = ['all', 'chats', 'important', 'schedule', 'gallery', 'hashtags'];
            if (validTabs.includes(tabName)) {
                document.getElementById(`tab-${tabName}`).classList.add('active');
            } else {
                document.getElementById('tab-all').classList.add('active');
            }
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
            document.getElementById('app').style.display = show ? 'none' : 'block';
            document.getElementById('error').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('app').style.display = 'none';
        }
        
        function showUpdateIndicator() {
            const indicator = document.getElementById('updateIndicator');
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 3000);
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        window.onload = function() {
            // Загружаем скрытые чаты из localStorage
            const saved = localStorage.getItem('hiddenChats');
            if (saved) {
                hiddenChats = JSON.parse(saved);
            }
            
            // Загружаем данные
            loadAllData();
            
            // Закрытие модалок по клику вне
            window.onclick = function(event) {
                if (event.target.classList.contains('modal')) {
                    event.target.classList.remove('active');
                }
            };
            
            // Автообновление каждые 5 минут
            setInterval(loadAllData, 5 * 60 * 1000);
        };
    </script>
</body>
</html>
