<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes" />
  <title>КПСС — группа</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="loading" id="loading">
    <div>Загрузка данных</div>
    <div class="spinner"></div>
  </div>

  <div class="error" id="error" style="display:none;">
    <h3>⚠️ Ошибка загрузки</h3>
    <div style="color:#b0b0b0;font-size:14px;margin:12px 0;" id="errorMessage"></div>
    <button class="retry-btn" onclick="location.reload()">Повторить</button>
  </div>

  <div class="app-container" id="app" style="display:none;">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 id="kpssTitle" style="cursor:pointer;">КПСС</h2>
        <span id="membersCount">данные из таблицы</span>
      </div>
      <div class="sidebar-menu">
        <div class="menu-item active" onclick="switchPage('home', this); closeSidebarOnMobile()">
          <span class="icon">🏠</span><span class="title">Главная</span>
        </div>
        <div class="menu-item" onclick="switchPage('schedule', this); closeSidebarOnMobile()">
          <span class="icon">📅</span><span class="title">Расписание</span>
        </div>
        <div class="menu-item" onclick="switchPage('hashtags', this); closeSidebarOnMobile()">
          <span class="icon">✨</span><span class="title">Хэштеги</span>
        </div>
        <div class="menu-item" onclick="switchPage('other', this); closeSidebarOnMobile()">
          <span class="icon">🔗</span><span class="title">Прочее</span>
        </div>
        <div class="menu-item" onclick="switchPage('gallery', this); closeSidebarOnMobile()">
          <span class="icon">🖼️</span><span class="title">Галерея</span>
        </div>
        <div class="menu-item" onclick="switchPage('important', this); closeSidebarOnMobile()">
          <span class="icon">📌</span><span class="title">Важное</span>
        </div>

        <!-- Админка: появляется только после входа -->
        <div class="menu-item" id="adminMenuItem" style="display:none;"
             onclick="switchPage('admin', this); closeSidebarOnMobile()">
          <span class="icon">⚙️</span><span class="title">Админ</span>
        </div>
      </div>
    </div>

    <div class="main-content" id="mainContent">
      <div class="content-header">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h1 id="mainTitle">КПСС</h1>
        <span id="headerMembers">данные из таблицы</span>

        <div class="header-actions">
          <div class="circle-btn" onclick="openDrawer()">●</div>
        </div>
      </div>

      <!-- Поиск (используется только для "Прочее") -->
      <div class="search-box" id="otherSearchBox" style="display:none;">
        <input type="text" placeholder="Поиск по ссылкам или #хэштегам..." id="otherSearchInput" onkeyup="renderOtherPage()">
      </div>

      <!-- Pages -->
      <div class="page active" id="page-home"></div>
      <div class="page" id="page-schedule"></div>
      <div class="page" id="page-hashtags"></div>
      <div class="page" id="page-other"></div>
      <div class="page" id="page-gallery"></div>
      <div class="page" id="page-important"></div>
      <div class="page" id="page-admin"></div>
    </div>
  </div>

  <!-- modal (используем и для пароля) -->
  <div class="modal" id="infoModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="infoModalTitle">Меню</span>
        <span class="modal-close" onclick="closeModal('infoModal')">✕</span>
      </div>
      <div class="modal-body" id="infoModalContent"></div>
    </div>
  </div>

  <div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <div class="image-modal-content">
      <span class="image-modal-close" onclick="closeImageModal()">✕</span>
      <img id="modalImage" src="" alt="">
    </div>
  </div>

  <div class="update-indicator" id="updateIndicator">Обновлено</div>

  <!-- Правая боковая панель меню -->
  <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
  <div class="right-drawer" id="rightDrawer">
    <div class="drawer-header">
      <div>Меню</div>
      <div class="drawer-close" onclick="closeDrawer()">✕</div>
    </div>
    <div class="drawer-body">
      <div class="drawer-item" onclick="refreshData(); closeDrawer();">🔄 Обновить данные</div>
      <div class="drawer-item" onclick="location.reload();">♻️ Перезагрузить</div>
      <div class="drawer-item" onclick="showAbout();">ℹ️ О проекте</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
