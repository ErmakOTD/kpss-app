<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>КПСС — группа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #2d2d2d;
            color: #f0f0f0;
            overflow-x: hidden;
        }
        
        /* Загрузка */
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 16px;
            color: #ff99cc;
            background-color: #2d2d2d;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin-top: 16px;
            border: 3px solid #404040;
            border-top-color: #ff99cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Главный контейнер */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            position: relative;
        }
        
        /* Боковое меню — серое с розовым */
        .sidebar {
            width: 280px;
            background-color: #363636;
            border-right: 1px solid #404040;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.2s ease;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
        }
        
        .sidebar.closed {
            transform: translateX(-100%);
        }
        
        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid #404040;
            background-color: #363636;
        }
        
        .sidebar-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: #ff99cc;
            letter-spacing: -0.3px;
        }
        
        .sidebar-header span {
            color: #b0b0b0;
            font-size: 13px;
            margin-top: 4px;
            display: block;
        }
        
        .sidebar-menu {
            padding: 12px 0;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            gap: 14px;
            color: #d0d0d0;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            margin: 2px 0;
        }
        
        .menu-item:hover {
            background-color: #404040;
            color: #ff99cc;
        }
        
        .menu-item.active {
            background-color: #404040;
            border-left-color: #ff99cc;
            color: #ff99cc;
            font-weight: 500;
        }
        
        .menu-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        
        .menu-item .badge {
            background-color: #ff99cc;
            color: #2d2d2d;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }
        
        /* Основной контент */
        .main-content {
            flex: 1;
            margin-left: 280px;
            width: calc(100% - 280px);
            transition: margin-left 0.2s ease;
            height: 100vh;
            overflow-y: auto;
            background-color: #2d2d2d;
        }
        
        .main-content.expanded {
            margin-left: 0;
            width: 100%;
        }
        
        /* Шапка */
        .content-header {
            background-color: #363636;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #404040;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .menu-toggle {
            font-size: 20px;
            cursor: pointer;
            color: #b0b0b0;
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 8px;
        }
        
        .menu-toggle:hover {
            background-color: #404040;
            color: #ff99cc;
        }
        
        .content-header h1 {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            color: #ff99cc;
        }
        
        .content-header span {
            font-size: 13px;
            color: #b0b0b0;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            color: #b0b0b0;
        }
        
        .header-actions span {
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 8px;
        }
        
        .header-actions span:hover {
            background-color: #404040;
            color: #ff99cc;
        }
        
        /* Вкладки */
        .tabs-container {
            background-color: #363636;
            border-bottom: 1px solid #404040;
            position: sticky;
            top: 60px;
            z-index: 90;
        }
        
        .tabs {
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0 12px;
            gap: 4px;
        }
        
        .tabs::-webkit-scrollbar {
            display: none;
        }
        
        .tab {
            padding: 12px 16px;
            color: #b0b0b0;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab:hover {
            color: #ff99cc;
        }
        
        .tab.active {
            color: #ff99cc;
            border-bottom-color: #ff99cc;
        }
        
        /* Контент вкладок */
        .tab-content {
            display: none;
            padding: 12px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Карточки */
        .section {
            background-color: #363636;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid #404040;
        }
        
        .section-header {
            padding: 16px 20px;
            color: #ff99cc;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #404040;
            cursor: pointer;
        }
        
        .section-header span:first-child {
            font-size: 18px;
        }
        
        .section-header span:last-child {
            margin-left: auto;
            color: #808080;
            font-size: 14px;
        }
        
        .section-content {
            padding: 4px 0;
        }
        
        .section-content.collapsed {
            display: none;
        }
        
        /* Элементы чата */
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background-color: #363636;
            border-bottom: 1px solid #404040;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .chat-item:last-child {
            border-bottom: none;
        }
        
        .chat-item:hover {
            background-color: #404040;
        }
        
        .chat-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #404040;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff99cc;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid #505050;
        }
        
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-item .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .chat-item .title {
            font-size: 16px;
            font-weight: 500;
            color: #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item .time {
            font-size: 11px;
            color: #808080;
            margin-left: 8px;
            flex-shrink: 0;
        }
        
        .chat-item .message {
            color: #b0b0b0;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item .sender {
            color: #ff99cc;
            font-weight: 500;
        }
        
        .chat-item .hide-btn {
            color: #ff99cc;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 30px;
            background-color: #404040;
            margin-left: 12px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        
        .chat-item .hide-btn:hover {
            opacity: 1;
            background-color: #505050;
        }
        
        .chat-item.hidden {
            display: none;
        }
        
        /* Важная информация */
        .important-card {
            background-color: #404040;
            margin: 12px 16px;
            padding: 16px;
            border-radius: 14px;
            border-left: 4px solid #ff99cc;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .important-card:hover {
            transform: translateX(4px);
            background-color: #454545;
        }
        
        .important-card .sender {
            color: #ff99cc;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .important-card .text {
            color: #f0f0f0;
            font-size: 15px;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .important-card .time {
            color: #808080;
            font-size: 11px;
            text-align: right;
        }
        
        /* Расписание */
        .schedule-grid {
            padding: 12px 16px;
        }
        
        .schedule-day {
            margin-bottom: 20px;
        }
        
        .schedule-day h3 {
            color: #ff99cc;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .schedule-lesson {
            display: flex;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #404040;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .schedule-lesson:hover {
            background-color: #404040;
        }
        
        .schedule-lesson:last-child {
            border-bottom: none;
        }
        
        .lesson-time {
            min-width: 75px;
            color: #b0b0b0;
            font-size: 13px;
            font-weight: 500;
        }
        
        .lesson-details {
            flex: 1;
        }
        
        .lesson-name {
            color: #f0f0f0;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .lesson-place {
            color: #808080;
            font-size: 12px;
        }
        
        /* Хэштеги */
        .hashtags-container {
            padding: 16px;
        }
        
        .hashtag-category {
            margin-bottom: 20px;
        }
        
        .category-title {
            color: #b0b0b0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .hashtag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .hashtag {
            background-color: #404040;
            color: #ff99cc;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #505050;
        }
        
        .hashtag:hover {
            background-color: #ff99cc;
            color: #2d2d2d;
            border-color: #ff99cc;
        }
        
        /* Галерея — ИСПРАВЛЕНО! */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px;
        }
        
        .gallery-item {
            background-color: #404040;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #505050;
            transition: all 0.2s;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
        }
        
        .gallery-item:hover {
            transform: translateY(-2px);
            border-color: #ff99cc;
            box-shadow: 0 4px 12px rgba(255,153,204,0.2);
        }
        
        .gallery-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-bottom: 1px solid #505050;
            background-color: #363636;
        }
        
        .gallery-caption {
            padding: 12px;
            font-size: 12px;
            color: #f0f0f0;
            text-align: center;
            font-weight: 500;
            background-color: #404040;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Модальное окно для картинок */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        
        .image-modal.active {
            display: flex;
        }
        
        .image-modal-content {
            max-width: 95%;
            max-height: 95vh;
            position: relative;
        }
        
        .image-modal img {
            max-width: 100%;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid #ff99cc;
        }
        
        .image-modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #ff99cc;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px;
        }
        
        .image-modal-close:hover {
            color: white;
        }
        
        /* Поиск */
        .search-box {
            padding: 12px 16px;
            background-color: #363636;
            border-bottom: 1px solid #404040;
        }
        
        .search-box input {
            width: 100%;
            padding: 14px 18px;
            background-color: #404040;
            border: 1px solid #505050;
            border-radius: 30px;
            color: #f0f0f0;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #ff99cc;
            background-color: #454545;
        }
        
        .search-box input::placeholder {
            color: #808080;
        }
        
        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background-color: #363636;
            border-radius: 24px;
            padding: 24px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            width: 380px;
            border: 1px solid #505050;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #ff99cc;
            font-size: 18px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #404040;
        }
        
        .modal-close {
            font-size: 22px;
            cursor: pointer;
            color: #808080;
            transition: color 0.2s;
        }
        
        .modal-close:hover {
            color: #ff99cc;
        }
        
        .modal-body {
            color: #f0f0f0;
            line-height: 1.6;
        }
        
        /* Индикатор обновления */
        .update-indicator {
            background-color: #ff99cc;
            color: #2d2d2d;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: none;
            z-index: 2000;
            box-shadow: 0 4px 12px rgba(255,153,204,0.3);
        }
        
        .update-indicator.show {
            display: block;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* Ошибка */
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #ff99cc;
            background-color: #2d2d2d;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .error h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #f0f0f0;
        }
        
        .retry-btn {
            background-color: #ff99cc;
            color: #2d2d2d;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .retry-btn:hover {
            background-color: #ffb3d9;
            transform: translateY(-2px);
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
            }
            
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            
            .content-header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div>КПСС · загрузка</div>
        <div class="spinner"></div>
    </div>
    
    <div class="error" id="error" style="display: none;">
        <h3>⚠️ Не удалось загрузить данные</h3>
        <div style="color: #b0b0b0; font-size: 14px; margin: 12px 0;" id="errorMessage"></div>
        <button class="retry-btn" onclick="location.reload()">Попробовать снова</button>
    </div>
    
    <div class="app-container" id="app" style="display: none;">
        <!-- Боковое меню -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>КПСС</h2>
                <span id="membersCount">17 участников</span>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" onclick="switchMainTab('home'); closeSidebarOnMobile()">
                    <span class="icon">🏠</span>
                    <span class="title">Главная</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('chats'); closeSidebarOnMobile()">
                    <span class="icon">💬</span>
                    <span class="title">Чаты</span>
                    <span class="badge" id="chatsBadge">0</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('schedule'); closeSidebarOnMobile()">
                    <span class="icon">📅</span>
                    <span class="title">Расписание</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('hashtags'); closeSidebarOnMobile()">
                    <span class="icon">✨</span>
                    <span class="title">Хэштеги</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('gallery'); closeSidebarOnMobile()">
                    <span class="icon">🖼️</span>
                    <span class="title">Галерея</span>
                </div>
                <div class="menu-item" onclick="switchMainTab('important'); closeSidebarOnMobile()">
                    <span class="icon">📌</span>
                    <span class="title">Важное</span>
                </div>
            </div>
        </div>
        
        <!-- Основной контент -->
        <div class="main-content" id="mainContent">
            <!-- Шапка -->
            <div class="content-header">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1 id="mainTitle">КПСС</h1>
                <span id="headerMembers">17 участников</span>
                <div class="header-actions">
                    <span onclick="toggleSearch()">🔍</span>
                    <span onclick="showMenu()">⋮</span>
                </div>
            </div>
            
            <!-- Вкладки -->
            <div class="tabs-container">
                <div class="tabs" id="tabs">
                    <div class="tab active" onclick="switchTab('all', this)">Все</div>
                    <div class="tab" onclick="switchTab('chats', this)">Чаты</div>
                    <div class="tab" onclick="switchTab('important', this)">Важное</div>
                    <div class="tab" onclick="switchTab('schedule', this)">Расписание</div>
                    <div class="tab" onclick="switchTab('gallery', this)">Галерея</div>
                    <div class="tab" onclick="switchTab('hashtags', this)">Хэштеги</div>
                </div>
            </div>
            
            <!-- Поиск -->
            <div class="search-box" id="searchBox" style="display: none;">
                <input type="text" placeholder="Поиск по чатам..." id="searchInput" onkeyup="searchChats()">
            </div>
            
            <!-- Контент (заполняется динамически) -->
            <div id="tabContent">
                <div class="tab-content active" id="tab-all"></div>
                <div class="tab-content" id="tab-chats"></div>
                <div class="tab-content" id="tab-important"></div>
                <div class="tab-content" id="tab-schedule"></div>
                <div class="tab-content" id="tab-gallery"></div>
                <div class="tab-content" id="tab-hashtags"></div>
            </div>
        </div>
    </div>
    
    <!-- Модальные окна -->
    <div class="modal" id="chatModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalChatTitle">Чат</span>
                <span class="modal-close" onclick="closeModal('chatModal')">✕</span>
            </div>
            <div class="modal-body" id="modalChatContent"></div>
        </div>
    </div>
    
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="infoModalTitle">Информация</span>
                <span class="modal-close" onclick="closeModal('infoModal')">✕</span>
            </div>
            <div class="modal-body" id="infoModalContent"></div>
        </div>
    </div>
    
    <!-- Новое модальное окно для картинок -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <div class="image-modal-content">
            <span class="image-modal-close" onclick="closeImageModal()">✕</span>
            <img id="modalImage" src="" alt="">
        </div>
    </div>
    
    <div class="update-indicator" id="updateIndicator">Данные обновлены</div>

    <script>
        // ========== ID ТАБЛИЦЫ ==========
        const SPREADSHEET_ID = '2PACX-1vSsSqamntRqegFjdSxWXgutpyHpZx69KijaC7QgKGCHV7zPtkE3lUZ3mSV17lCZsYMep1so1gjCOk7G';
        
        // Прокси-серверы для обхода CORS
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://cors-anywhere.herokuapp.com/',
            'https://proxy.cors.sh/'
        ];
        
        // Данные приложения
        let appData = {
            important: [],
            chats: [],
            schedule: [],
            hashtags: [],
            gallery: []
        };
        
        let hiddenChats = [];
        let loadAttempts = 0;
        
        // ========== ЗАГРУЗКА ДАННЫХ ==========
        async function loadAllData() {
            showLoading(true);
            loadAttempts++;
            
            try {
                await loadWithProxy();
                
                if (appData.chats.length === 0 && appData.important.length === 0) {
                    throw new Error('Нет данных');
                }
                
                console.log('✅ Данные загружены:', appData);
                renderAll();
                updateCounters();
                showLoading(false);
                showUpdateIndicator();
                
            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                
                if (loadAttempts < 3) {
                    setTimeout(loadAllData, 1000);
                } else {
                    showLoading(false);
                    showError('Не удалось загрузить данные. Проверьте интернет.');
                }
            }
        }
        
        async function loadWithProxy() {
            const sheets = ['important', 'chats', 'schedule', 'hashtags', 'gallery'];
            
            for (const sheet of sheets) {
                let success = false;
                
                for (const proxy of PROXIES) {
                    try {
                        const url = `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?output=csv&sheet=${sheet}`;
                        const proxyUrl = proxy + encodeURIComponent(url);
                        
                        const response = await fetchWithTimeout(proxyUrl);
                        if (response && response.length > 100) {
                            appData[sheet] = parseCSV(response);
                            success = true;
                            break;
                        }
                    } catch (e) {
                        console.log(`Прокси ${proxy} не сработал для ${sheet}`);
                    }
                }
                
                if (!success) {
                    try {
                        const directUrl = `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?output=csv&sheet=${sheet}`;
                        const response = await fetchWithTimeout(directUrl);
                        if (response) {
                            appData[sheet] = parseCSV(response);
                        }
                    } catch (e) {
                        console.log(`Прямой запрос не сработал для ${sheet}`);
                    }
                }
            }
        }
        
        async function fetchWithTimeout(url, timeout = 8000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            
            try {
                const response = await fetch(url, {
                    signal: controller.signal,
                    mode: 'cors',
                    cache: 'no-cache',
                    headers: {
                        'Accept': 'text/csv, text/plain, */*'
                    }
                });
                
                clearTimeout(id);
                
                if (!response.ok) return null;
                return await response.text();
            } catch (error) {
                clearTimeout(id);
                return null;
            }
        }
        
        function parseCSV(csv) {
            if (!csv || csv.length < 10) return [];
            
            const lines = csv.split('\n');
            if (lines.length < 2) return [];
            
            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
            const result = [];
            
            for (let i = 1; i < Math.min(lines.length, 20); i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const values = line.split(',').map(v => v.replace(/^"|"$/g, '').trim());
                const obj = {};
                
                headers.forEach((header, index) => {
                    if (header && values[index]) {
                        obj[header] = values[index];
                    }
                });
                
                if (Object.keys(obj).length > 0) {
                    result.push(obj);
                }
            }
            
            return result;
        }
        
        // ========== ОТОБРАЖЕНИЕ ==========
        function renderAll() {
            renderMainPage();
            renderChatsPage();
            renderImportantPage();
            renderSchedulePage();
            renderHashtagsPage();
            renderGalleryPage();
        }
        
        function renderMainPage() {
            const container = document.getElementById('tab-all');
            if (!container) return;
            
            let html = '';
            
            // Важная информация
            if (appData.important?.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-header" onclick="toggleSection(this)">
                            <span>📌</span> Важное
                            <span>▼</span>
                        </div>
                        <div class="section-content">
                `;
                
                appData.important.slice(0, 3).forEach(item => {
                    html += `
                        <div class="important-card" onclick="showImportantDetails('${item.id}')">
                            <div class="sender">${item.sender || 'КПСС'}</div>
                            <div class="text">${item.text || ''}</div>
                            <div class="time">${item.time || ''}</div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            // Расписание
            if (appData.schedule?.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-header" onclick="toggleSection(this)">
                            <span>📅</span> Расписание
                            <span>▼</span>
                        </div>
                        <div class="section-content">
                            <div class="schedule-grid">
                `;
                
                appData.schedule.slice(0, 3).forEach(lesson => {
                    html += `
                        <div class="schedule-lesson" onclick="showLessonDetails('${lesson.id}')">
                            <div class="lesson-time">${lesson.time?.split('-')[0] || ''}</div>
                            <div class="lesson-details">
                                <div class="lesson-name">${lesson.subject || ''}</div>
                                <div class="lesson-place">${lesson.room || ''}</div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div></div></div>`;
            }
            
            // Чаты
            if (appData.chats?.length > 0) {
                html += `
                    <div class="section">
                        <div class="section-header" onclick="toggleSection(this)">
                            <span>💬</span> Чаты
                            <span>▼</span>
                        </div>
                        <div class="section-content" id="chatsContainer">
                `;
                
                appData.chats.slice(0, 5).forEach(chat => {
                    const isHidden = hiddenChats.includes(`chat-${chat.id}`);
                    html += `
                        <div class="chat-item ${isHidden ? 'hidden' : ''}" id="chat-${chat.id}" onclick="openChat('${chat.id}')">
                            <div class="avatar">${chat.avatar || '💬'}</div>
                            <div class="info">
                                <div class="title-row">
                                    <span class="title">${chat.name || 'Чат'}</span>
                                    <span class="time">${chat.time || ''}</span>
                                </div>
                                <div class="message">
                                    <span class="sender">${chat.last_sender || ''}:</span> ${(chat.last_message || '').substring(0, 40)}${chat.last_message?.length > 40 ? '...' : ''}
                                </div>
                            </div>
                            <span class="hide-btn" onclick="hideChat('chat-${chat.id}', event)">✕</span>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            container.innerHTML = html || '<div class="section" style="padding: 20px; text-align: center;">Нет данных</div>';
        }
        
        function renderChatsPage() {
            const container = document.getElementById('tab-chats');
            if (!container || !appData.chats) return;
            
            let html = `
                <div class="section">
                    <div class="section-header">💬 Все чаты</div>
                    <div class="section-content">
            `;
            
            appData.chats.forEach(chat => {
                const isHidden = hiddenChats.includes(`chat-${chat.id}`);
                html += `
                    <div class="chat-item ${isHidden ? 'hidden' : ''}" id="chat2-${chat.id}" onclick="openChat('${chat.id}')">
                        <div class="avatar">${chat.avatar || '💬'}</div>
                        <div class="info">
                            <div class="title-row">
                                <span class="title">${chat.name || 'Чат'}</span>
                                <span class="time">${chat.time || ''}</span>
                            </div>
                            <div class="message">
                                <span class="sender">${chat.last_sender || ''}:</span> ${chat.last_message || ''}
                            </div>
                        </div>
                        <span class="hide-btn" onclick="hideChat('chat-${chat.id}', event)">✕</span>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        function renderImportantPage() {
            const container = document.getElementById('tab-important');
            if (!container) return;
            
            let html = `
                <div class="section">
                    <div class="section-header">📌 Вся важная информация</div>
                    <div class="section-content">
            `;
            
            if (appData.important?.length > 0) {
                appData.important.forEach(item => {
                    html += `
                        <div class="important-card" onclick="showImportantDetails('${item.id}')">
                            <div class="sender">${item.sender || 'КПСС'}</div>
                            <div class="text">${item.text || ''}</div>
                            <div class="time">${item.time || ''}</div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="padding: 20px; text-align: center;">Нет важной информации</div>';
            }
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        function renderSchedulePage() {
            const container = document.getElementById('tab-schedule');
            if (!container) return;
            
            const byDay = {};
            appData.schedule?.forEach(lesson => {
                if (lesson.day) {
                    if (!byDay[lesson.day]) byDay[lesson.day] = [];
                    byDay[lesson.day].push(lesson);
                }
            });
            
            let html = `
                <div class="section">
                    <div class="section-header">📅 Полное расписание</div>
                    <div class="section-content">
                        <div class="schedule-grid">
            `;
            
            if (Object.keys(byDay).length > 0) {
                Object.keys(byDay).forEach(day => {
                    html += `<div class="schedule-day"><h3>${day}</h3>`;
                    byDay[day].forEach(lesson => {
                        html += `
                            <div class="schedule-lesson" onclick="showLessonDetails('${lesson.id}')">
                                <div class="lesson-time">${lesson.time || ''}</div>
                                <div class="lesson-details">
                                    <div class="lesson-name">${lesson.subject || ''}</div>
                                    <div class="lesson-place">${lesson.room || ''} · ${lesson.teacher || ''}</div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                });
            } else {
                html += '<div style="padding: 20px; text-align: center;">Нет расписания</div>';
            }
            
            html += `</div></div></div>`;
            container.innerHTML = html;
        }
        
        function renderHashtagsPage() {
            const container = document.getElementById('tab-hashtags');
            if (!container) return;
            
            const byCategory = {};
            appData.hashtags?.forEach(tag => {
                if (tag.category) {
                    if (!byCategory[tag.category]) byCategory[tag.category] = [];
                    byCategory[tag.category].push(tag.tag);
                }
            });
            
            let html = `
                <div class="section">
                    <div class="section-header">✨ Все хэштеги</div>
                    <div class="hashtags-container">
            `;
            
            if (Object.keys(byCategory).length > 0) {
                Object.keys(byCategory).forEach(category => {
                    html += `
                        <div class="hashtag-category">
                            <div class="category-title">${category}</div>
                            <div class="hashtag-cloud">
                    `;
                    
                    byCategory[category].forEach(tag => {
                        html += `<span class="hashtag" onclick="searchByHashtag('${tag}')">${tag}</span>`;
                    });
                    
                    html += `</div></div>`;
                });
            } else {
                html += '<div style="padding: 20px; text-align: center;">Нет хэштегов</div>';
            }
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        // ИСПРАВЛЕННАЯ ГАЛЕРЕЯ
        function renderGalleryPage() {
            const container = document.getElementById('tab-gallery');
            if (!container) return;
            
            let html = `
                <div class="section">
                    <div class="section-header">🖼️ Галерея</div>
                    <div class="gallery-grid">
            `;
            
            if (appData.gallery?.length > 0) {
                appData.gallery.slice(0, 12).forEach(item => {
                    // Используем реальные URL картинок или заглушки
                    const imgUrl = item.image_url && item.image_url !== 'https://example.com/image1.jpg' 
                        ? item.image_url 
                        : 'https://via.placeholder.com/300x200/404040/ff99cc?text=КПСС';
                    
                    html += `
                        <div class="gallery-item" onclick="openImageModal('${imgUrl}')">
                            <img class="gallery-image" src="${imgUrl}" 
                                 onerror="this.src='https://via.placeholder.com/300x200/404040/ff99cc?text=Нет+фото'"
                                 alt="${item.title || 'Изображение'}">
                            <div class="gallery-caption">${item.title || 'Изображение'}</div>
                        </div>
                    `;
                });
            } else {
                // Показываем примеры картинок
                for (let i = 1; i <= 6; i++) {
                    html += `
                        <div class="gallery-item" onclick="openImageModal('https://via.placeholder.com/300x200/404040/ff99cc?text=КПСС+${i}')">
                            <img class="gallery-image" src="https://via.placeholder.com/300x200/404040/ff99cc?text=КПСС+${i}" 
                                 alt="КПСС">
                            <div class="gallery-caption">Галерея КПСС</div>
                        </div>
                    `;
                }
            }
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        // ========== НОВЫЕ ФУНКЦИИ ДЛЯ КАРТИНОК ==========
        function openImageModal(imageUrl) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = imageUrl;
            modal.classList.add('active');
        }
        
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }
        
        // ========== ОСТАЛЬНЫЕ ФУНКЦИИ ==========
        function toggleSection(header) {
            const content = header.nextElementSibling;
            const arrow = header.querySelector('span:last-child');
            
            if (content.style.display === 'none') {
                content.style.display = 'block';
                arrow.textContent = '▼';
            } else {
                content.style.display = 'none';
                arrow.textContent = '▶';
            }
        }
        
        function openChat(chatId) {
            const chat = appData.chats.find(c => c.id == chatId);
            if (!chat) return;
            
            document.getElementById('modalChatTitle').textContent = chat.name || 'Чат';
            document.getElementById('modalChatContent').innerHTML = `
                <div style="background: #404040; padding: 16px; border-radius: 12px;">
                    <div style="color: #ff99cc; font-weight: 500; margin-bottom: 8px;">${chat.last_sender || ''}</div>
                    <div style="margin-bottom: 12px;">${chat.last_message || ''}</div>
                    <div style="color: #808080; font-size: 12px;">${chat.time || ''}</div>
                </div>
            `;
            
            document.getElementById('chatModal').classList.add('active');
        }
        
        function hideChat(chatId, event) {
            event.stopPropagation();
            
            const chat = document.getElementById(chatId);
            if (chat) {
                chat.classList.add('hidden');
                if (!hiddenChats.includes(chatId)) {
                    hiddenChats.push(chatId);
                    localStorage.setItem('hiddenChats', JSON.stringify(hiddenChats));
                }
            }
            
            updateCounters();
        }
        
        function updateCounters() {
            if (!appData.chats) return;
            const visible = appData.chats.length - hiddenChats.length;
            const badge = document.getElementById('chatsBadge');
            if (badge) {
                badge.textContent = visible;
                badge.style.display = visible > 0 ? 'inline' : 'none';
            }
        }
        
        function showImportantDetails(id) {
            const item = appData.important.find(i => i.id == id);
            if (!item) return;
            
            document.getElementById('infoModalTitle').textContent = 'Важная информация';
            document.getElementById('infoModalContent').innerHTML = `
                <div style="background: #404040; padding: 16px; border-radius: 12px;">
                    <div style="color: #ff99cc; font-weight: 500; margin-bottom: 8px;">${item.sender || 'КПСС'}</div>
                    <div style="margin-bottom: 12px;">${item.text || ''}</div>
                    <div style="color: #808080;">${item.time || ''} · ${item.date || ''}</div>
                </div>
            `;
            
            document.getElementById('infoModal').classList.add('active');
        }
        
        function showLessonDetails(id) {
            const lesson = appData.schedule.find(l => l.id == id);
            if (!lesson) return;
            
            document.getElementById('infoModalTitle').textContent = lesson.subject || 'Занятие';
            document.getElementById('infoModalContent').innerHTML = `
                <div style="background: #404040; padding: 16px; border-radius: 12px;">
                    <div style="margin-bottom: 8px;"><span style="color: #808080;">Время:</span> ${lesson.time || ''}</div>
                    <div style="margin-bottom: 8px;"><span style="color: #808080;">Аудитория:</span> ${lesson.room || ''}</div>
                    <div style="margin-bottom: 8px;"><span style="color: #808080;">Преподаватель:</span> ${lesson.teacher || ''}</div>
                    <div style="color: #808080;">${lesson.day || ''}</div>
                </div>
            `;
            
            document.getElementById('infoModal').classList.add('active');
        }
        
        function searchByHashtag(tag) {
            document.getElementById('infoModalTitle').textContent = 'Поиск';
            document.getElementById('infoModalContent').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <span class="hashtag" style="font-size: 16px;">${tag}</span>
                </div>
            `;
            document.getElementById('infoModal').classList.add('active');
        }
        
        function toggleSearch() {
            const box = document.getElementById('searchBox');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
            if (box.style.display === 'block') {
                document.getElementById('searchInput').focus();
            }
        }
        
        function searchChats() {
            const text = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.chat-item').forEach(chat => {
                const title = chat.querySelector('.title')?.textContent.toLowerCase() || '';
                chat.style.display = title.includes(text) ? 'flex' : 'none';
            });
        }
        
        function showMenu() {
            document.getElementById('infoModalTitle').textContent = 'Меню';
            document.getElementById('infoModalContent').innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div onclick="showAllChats()" style="padding: 12px; background: #404040; border-radius: 12px; cursor: pointer;">Показать все чаты</div>
                    <div onclick="refreshData()" style="padding: 12px; background: #404040; border-radius: 12px; cursor: pointer;">Обновить данные</div>
                    <div onclick="location.reload()" style="padding: 12px; background: #404040; border-radius: 12px; cursor: pointer;">Перезагрузить</div>
                </div>
            `;
            document.getElementById('infoModal').classList.add('active');
        }
        
        function showAllChats() {
            hiddenChats = [];
            localStorage.removeItem('hiddenChats');
            document.querySelectorAll('.chat-item').forEach(c => c.classList.remove('hidden'));
            updateCounters();
            closeModal('infoModal');
        }
        
        function refreshData() {
            closeModal('infoModal');
            loadAttempts = 0;
            loadAllData();
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
            document.getElementById('mainContent').classList.toggle('expanded');
        }
        
        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('closed');
                document.getElementById('mainContent').classList.add('expanded');
            }
        }
        
        function switchMainTab(tabName) {
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const titles = {
                'home': 'КПСС', 'chats': 'Чаты', 'schedule': 'Расписание',
                'hashtags': 'Хэштеги', 'gallery': 'Галерея', 'important': 'Важное'
            };
            document.getElementById('mainTitle').textContent = titles[tabName];
            
            if (tabName === 'home') {
                switchTab('all', document.querySelector('.tab'));
            } else {
                switchTab(tabName, null);
            }
        }
        
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            if (element) {
                element.classList.add('active');
            } else {
                document.querySelectorAll('.tab').forEach(t => {
                    if (t.textContent.toLowerCase().includes(tabName)) {
                        t.classList.add('active');
                    }
                });
            }
            
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            const validTabs = ['all', 'chats', 'important', 'schedule', 'gallery', 'hashtags'];
            if (validTabs.includes(tabName)) {
                document.getElementById(`tab-${tabName}`).classList.add('active');
            } else {
                document.getElementById('tab-all').classList.add('active');
            }
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
            document.getElementById('app').style.display = show ? 'none' : 'block';
            document.getElementById('error').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('app').style.display = 'none';
        }
        
        function showUpdateIndicator() {
            const ind = document.getElementById('updateIndicator');
            ind.classList.add('show');
            setTimeout(() => ind.classList.remove('show'), 2000);
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        // ========== СТАРТ ==========
        window.onload = function() {
            const saved = localStorage.getItem('hiddenChats');
            if (saved) hiddenChats = JSON.parse(saved);
            
            loadAllData();
            
            window.onclick = function(e) {
                if (e.target.classList.contains('modal')) {
                    e.target.classList.remove('active');
                }
                if (e.target.classList.contains('image-modal')) {
                    closeImageModal();
                }
            };
            
            setInterval(() => {
                loadAttempts = 0;
                loadAllData();
            }, 5 * 60 * 1000);
        };
    </script>
</body>
</html>
