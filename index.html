<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes" />
  <title>КПСС — группа</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="loading" id="loading">
    <div>Загрузка данных</div>
    <div class="spinner"></div>
  </div>

  <div class="error" id="error" style="display:none;">
    <h3>⚠️ Ошибка загрузки</h3>
    <div class="error-msg" id="errorMessage"></div>
    <button class="retry-btn" onclick="location.reload()">Повторить</button>
  </div>

  <div class="app-container" id="app" style="display:none;">

    <!-- RIGHT SIDEBAR -->
    <aside class="sidebar closed" id="sidebar">
      <div class="sidebar-header">
        <h2 id="kpssTitle">КПСС</h2>
        <span id="membersCount">данные из таблицы</span>
      </div>

      <nav class="sidebar-menu">
        <div class="menu-item active" data-page="home">
          <span class="icon">🏠</span><span class="title">Главная</span>
        </div>
        <div class="menu-item" data-page="schedule">
          <span class="icon">📅</span><span class="title">Расписание</span>
        </div>
        <div class="menu-item" data-page="hashtags">
          <span class="icon">✨</span><span class="title">Хэштеги</span>
        </div>
        <div class="menu-item" data-page="other">
          <span class="icon">🔗</span><span class="title">Прочее</span>
        </div>
        <div class="menu-item" data-page="gallery">
          <span class="icon">🖼️</span><span class="title">Галерея</span>
        </div>
        <div class="menu-item" data-page="important">
          <span class="icon">📌</span><span class="title">Важное</span>
        </div>

        <!-- Visible only after login -->
        <div class="menu-item" id="chatsMenuItem" data-page="chats" style="display:none;">
          <span class="icon">💬</span><span class="title">Чаты</span>
          <span class="badge" id="globalUnreadBadge" style="display:none;">0</span>
        </div>
        <div class="menu-item" id="contactsMenuItem" data-page="contacts" style="display:none;">
          <span class="icon">📇</span><span class="title">Контакты</span>
        </div>

        <!-- Visible only after admin login -->
        <div class="menu-item" id="adminMenuItem" data-page="admin" style="display:none;">
          <span class="icon">⚙️</span><span class="title">Админ</span>
        </div>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main-content expanded" id="mainContent">
      <header class="content-header">
        <!-- button like your screenshot -->
        <button class="menu-toggle-square" id="menuSquareBtn" title="Меню">
          ☰
        </button>

        <h1 id="mainTitle">КПСС</h1>
        <span id="headerMembers">данные из таблицы</span>

        <div class="header-actions">
          <div class="circle-btn" id="circleMenuBtn" title="Меню">●</div>
        </div>
      </header>

      <!-- Search only for Other -->
      <div class="search-box" id="otherSearchBox" style="display:none;">
        <input type="text" placeholder="Поиск по ссылкам или #хэштегам..." id="otherSearchInput">
      </div>

      <!-- Pages -->
      <section class="page active" id="page-home"></section>
      <section class="page" id="page-schedule"></section>
      <section class="page" id="page-hashtags"></section>
      <section class="page" id="page-other"></section>
      <section class="page" id="page-gallery"></section>
      <section class="page" id="page-important"></section>

      <section class="page" id="page-chats"></section>
      <section class="page" id="page-contacts"></section>
      <section class="page" id="page-chat"></section>

      <section class="page" id="page-admin"></section>
    </main>
  </div>

  <!-- COMMON MODAL -->
  <div class="modal" id="infoModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="infoModalTitle">Меню</span>
        <span class="modal-close" id="modalCloseBtn">✕</span>
      </div>
      <div class="modal-body" id="infoModalContent"></div>
    </div>
  </div>

  <!-- IMAGE MODAL -->
  <div class="image-modal" id="imageModal">
    <div class="image-modal-content">
      <span class="image-modal-close" id="imageModalCloseBtn">✕</span>
      <img id="modalImage" src="" alt="">
    </div>
  </div>

  <!-- UPDATE INDICATOR -->
  <div class="update-indicator" id="updateIndicator">Обновлено</div>

  <!-- RIGHT DRAWER -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="right-drawer" id="rightDrawer">
    <div class="drawer-header">
      <div>Меню</div>
      <div class="drawer-close" id="drawerCloseBtn">✕</div>
    </div>
    <div class="drawer-body">
      <div class="drawer-item" id="drawerRefreshBtn">🔄 Обновить данные</div>
      <div class="drawer-item" id="drawerAuthBtn">👤 Вход / Регистрация</div>
      <div class="drawer-item" id="drawerLogoutBtn" style="display:none;">🚪 Выйти</div>
      <div class="drawer-item" id="drawerReloadBtn">♻️ Перезагрузить</div>
      <div class="drawer-item" id="drawerAboutBtn">ℹ️ О проекте</div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
